<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <video autoplay muted loop playsinline id="bg-video" poster="fallback.jpg">
      <source src="vid/coverfire.mp4" type="video/mp4" />
    </video>
    <div class="video-overlay"></div>
    <div class="container">
      <h1>Temperature Converter</h1>
      <p class="subtitle">
        Quickly convert between Celsius, Fahrenheit and Kelvin
      </p>

      <div class="card">
        <label for="tempInput">Enter Temperature:</label>
        <input type="number" id="tempInput" placeholder="e.g. 25" step="any" />
        <span id="tempError" class="error"></span>

        <label for="conversionType">Convert From:</label>
        <select id="conversionType">
          <option value="">--Select Unit--</option>
          <option value="c">Celsius (°C)</option>
          <option value="f">Fahrenheit (°F)</option>
          <option value="k">Kelvin (K)</option>
        </select>
        <span id="typeError" class="error"></span>

        <button id="convertBtn" class="convert-btn">Convert</button>

        <div id="resultBox" class="result-box"></div>
      </div>
    </div>
    <script src="home.js"></script>
  </body>
</html>
