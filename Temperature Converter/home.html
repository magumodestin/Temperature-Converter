<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<video autoplay muted loop playsinline id="bg-video"poster="fallback.jpg">
<source src="vid/coverfire.mp4"type="video/mp4">
</video>
<div class="video-overlay"></div>
    <div class="container">
        <h1>Temperature Converter</h1>
        <p class="subtitle">Quickly convert between Celsius and Fahrenheit</p>

        <div class="card">
            <label for="tempInput">Enter Temperature:</label>
            <input type="number" id="tempInput" placeholder="e.g. 25">
            <span id="tempError" class="error"></span>

            <label for="conversionType">Select Conversion Type:</label>
            <select id="conversionType">
                <option value="">--Select Conversion--</option>
                <option value="c-to-f">Celsius (°C) to Fahrenheit (°F)</option>
                <option value="f-to-c">Fahrenheit (°F) to Celsius (°C)</option>
            </select>
            <span id="typeError" class="error"></span>

            <button id="convertBtn" class="convert-btn">Convert</button>
            
            <div id="resultBox" class="result-box"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
